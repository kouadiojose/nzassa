name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nzassa
          POSTGRES_PASSWORD: nzassa_dev
          POSTGRES_DB: nzassa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nzassa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        working-directory: apps/backend
        run: pip install -e ".[dev]"
      - name: Ruff
        working-directory: apps/backend
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Mypy
        working-directory: apps/backend
        run: mypy src
      - name: Tests
        working-directory: apps/backend
        env:
          DATABASE_URL_TEST: postgresql+asyncpg://nzassa:nzassa_dev@localhost:5432/nzassa_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Tests
        working-directory: apps/web
        run: npm test -- --watch=false --browsers=ChromeHeadless

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Tests
        working-directory: apps/mobile
        run: flutter test
